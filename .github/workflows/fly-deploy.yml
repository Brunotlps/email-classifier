name: Fly Deploy

# Deployment lives in ci.yml so the Production environment secret is resolved by
# the same workflow job that requests its approval. This pointer cannot deploy.
on:
  workflow_dispatch:
    inputs:
      disabled:
        description: Reserved; direct execution is not supported.
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  disabled:
    if: ${{ github.ref == 'refs/heads/never-deploy' && inputs.disabled == true }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
