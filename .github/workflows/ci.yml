name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a ref group; each main push gets its own quality run. Deploys
  # remain serialized by the deploy job's separate deploy-group below.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run deterministic Python suite
        run: python -m pytest

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/extension_background.test.js
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -type f -name '*.js' -print0)
      - name: Parse extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('extension/manifest.json', 'utf8'))"

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag briskmail-ci:local .
      - name: Smoke container health without external network
        run: bash scripts/ci/container-smoke.sh briskmail-ci:local

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [python, extension, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every quality job to succeed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for result in "$PYTHON_RESULT" "$EXTENSION_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "A required quality job did not succeed: $result"
              exit 1
            fi
          done

  deploy:
    needs: [ci-gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Deploy app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: Production
      url: https://email-classifier-api.fly.dev
    concurrency:
      group: deploy-group
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: '0.4.101'
      - name: Deploy the exact commit validated by ci-gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Deploying validated commit $GITHUB_SHA"
          flyctl deploy --app email-classifier-api --remote-only --depot=false \
            --image-label "$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
      - name: Check public health after deployment
        timeout-minutes: 2
        run: python3 scripts/ci/public_health.py https://email-classifier-api.fly.dev/health
      - name: Record successful deployment
        run: |
          {
            echo '### Fly production deployment'
            echo "Validated and deployed commit: $GITHUB_SHA"
            echo "Image tag: registry.fly.io/email-classifier-api:$GITHUB_SHA"
            echo 'Public /health: HTTP 200 and healthy JSON'
          } >> "$GITHUB_STEP_SUMMARY"
