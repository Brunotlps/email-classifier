name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run deterministic Python suite
        run: python -m pytest

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/extension_background.test.js
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -type f -name '*.js' -print0)
      - name: Parse extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('extension/manifest.json', 'utf8'))"

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag briskmail-ci:local .
      - name: Smoke container health without external network
        run: bash scripts/ci/container-smoke.sh briskmail-ci:local

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [python, extension, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every quality job to succeed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for result in "$PYTHON_RESULT" "$EXTENSION_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "A required quality job did not succeed: $result"
              exit 1
            fi
          done
