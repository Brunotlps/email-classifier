# fly.toml app configuration file generated for email-classifier-api on 2026-04-28T09:25:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'email-classifier-api'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # FastAPI startup allowance; /health does not call an AI provider.
  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
